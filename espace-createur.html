<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Espace créateur — Inkrise</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="assets/inkrise-fonts.css" />
<link rel="stylesheet" href="assets/inkrise-theme.css" />
<script src="assets/inkrise-theme.js"></script>
<!--
  Cette page était un SECOND tableau de bord pour la même personne : le
  profil montrait ses formations sans permettre de les modifier, et
  l'espace créateur permettait de les modifier sans montrer le reste. On
  passait de l'un à l'autre pour une seule tâche.

  Tout est désormais dans l'onglet « Formations » de profil.html. Le
  fichier reste ici parce que des liens extérieurs, des favoris et une
  redirection de vercel.json y menaient : il conduit au bon endroit
  plutôt que d'afficher une page morte.

  La redirection est faite en JavaScript ET par <meta refresh> : la
  seconde couvre le cas où le script ne s'exécute pas.
-->
<script>
  (function () {
    /* `?edit=7` était l'adresse d'édition directe d'un pack, appelée
       depuis pack.html. Le paramètre est reconduit tel quel. */
    var p = new URLSearchParams(location.search);
    var edit = p.get('edit');
    location.replace('profil.html?tab=formations' +
      (edit ? '&edit=' + encodeURIComponent(edit) : ''));
  })();
</script>
<meta http-equiv="refresh" content="0; url=profil.html?tab=formations" />
<style>
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 24px; text-align: center;
  }
  a { color: var(--purple-link); font-weight: 700; }
</style>
</head>
<body>
  <p>
    L'espace créateur a rejoint ton profil.<br />
    <a href="profil.html?tab=formations">Ouvrir mes formations →</a>
  </p>
</body>
</html>
