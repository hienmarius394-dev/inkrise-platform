<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="assets/inkrise-theme.css" />
  <script src="assets/inkrise-theme.js"></script>

<style>
/* Nav, menu latéral et barre du bas : voir assets/inkrise-theme.css */
    :root {
          --border2: rgba(124,111,239,0.15);
        }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 90px; }



    /* Au-delà du mobile, la nav du haut suffit : la barre du bas recouvrirait
       le bas du contenu sur toute la largeur de l'écran. */
    @media (min-width: 681px) { .univ-bnav { display: none; } body { padding-bottom: 24px; } }

    /* ── HERO SEARCH ── */
    .search-hero {
      background: linear-gradient(180deg, #1a0a2e 0%, var(--bg) 100%);
      padding: 48px 24px 36px;
      position: relative;
      overflow: hidden;
    }
    .search-hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 0%, rgba(124,111,239,0.14) 0%, transparent 70%);
      pointer-events: none;
    }
    .search-hero-inner {
      max-width: 640px; margin: 0 auto;
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .search-hero-title {
      font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800;
      text-align: center; color: var(--text);
    }
    .search-hero-title em { font-style: normal; color: var(--purple-link); }
    .search-bar-large {
      display: flex; align-items: center; gap: 0;
      background: rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.1);
      border-radius: 22px; overflow: hidden; width: 100%;
      transition: border-color .2s;
    }
    .search-bar-large:focus-within { border-color: var(--purple); }
    .search-bar-large input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 1rem; font-family: 'DM Sans', sans-serif;
      padding: 14px 18px;
    }
    .search-bar-large input::placeholder { color: var(--muted); }
    /* --purple (#7c5cfc) sous du texte blanc ne donne que 4,38:1 : on
       prend la teinte de lien, plus foncée (5,5:1). */
    .search-bar-large button {
      background: var(--purple-link); border: none; cursor: pointer;
      color: var(--sur-purple); font-size: 1rem; padding: 14px 20px;
      transition: background .2s; flex-shrink: 0;
    }
    .search-bar-large button:hover { background: #6558d8; }

    /* ── MAIN WRAP ── */
    .main-wrap { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

    /* ── FILTRES ──
       Le catalogue ne se parcourait qu'au mot-clé : genre, type et tri
       existaient en base et s'affichaient sur les cartes, mais rien ne
       permettait de s'en servir pour restreindre la liste. */
    .filters-bar {
      max-width: 1200px; margin: 0 auto; padding: 20px 24px 0;
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
    }
    .filter-group { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .filter-group label {
      font-size: .68rem; font-weight: 800; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text-3);
    }
    .filter-group select {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 9px; padding: 9px 12px;
      font-size: .84rem; font-family: 'DM Sans', sans-serif;
      cursor: pointer; outline: none; min-height: 40px; min-width: 132px;
    }
    .filter-group select:focus-visible { outline: 2px solid var(--purple); outline-offset: 1px; }
    .btn-reset-filters {
      background: none; border: 1px solid var(--border); color: var(--text-2);
      border-radius: 9px; padding: 9px 14px; font-size: .82rem; font-weight: 700;
      cursor: pointer; font-family: 'DM Sans', sans-serif; min-height: 40px;
      transition: all .2s;
    }
    .btn-reset-filters:hover { border-color: var(--purple); color: var(--purple-link); }
    .filters-count {
      margin-left: auto; font-size: .82rem; color: var(--text-2); font-weight: 600;
      align-self: center; padding-bottom: 2px;
    }
    @media (max-width: 640px) {
      .filters-bar { padding: 16px 16px 0; gap: 9px; }
      .filter-group { flex: 1 1 calc(50% - 5px); }
      .filter-group select { min-width: 0; width: 100%; }
      .filters-count { margin-left: 0; flex-basis: 100%; padding-top: 4px; }
    }

    /* ── VOIR PLUS ──
       Auparavant la liste s'arrêtait à 40 titres sans le dire : au-delà,
       une partie du catalogue devenait invisible en silence. */
    .load-more-wrap { display: flex; justify-content: center; padding: 8px 0 40px; }
    .btn-load-more {
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      padding: 13px 30px; border-radius: 12px; font-weight: 700; font-size: .9rem;
      cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all .2s;
      min-height: 46px;
    }
    .btn-load-more:hover:not(:disabled) { background: rgba(124,111,239,.15); border-color: var(--purple); }
    .btn-load-more:disabled { opacity: .6; cursor: default; }

    /* ── LOADING ── */
    .page-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 40vh; gap: 16px; color: var(--muted); }
    .loading-ring { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--purple); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── SECTION HEADER ── */
    .section-header { margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
    .section-title {
      font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700;
      display: flex; align-items: center; gap: 10px; white-space: nowrap;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); min-width: 20px; }
    .section-count {
      font-size: 0.78rem; color: var(--muted); font-weight: 600;
      background: var(--surface2); padding: 2px 9px; border-radius: 20px;
      white-space: nowrap;
    }
    .section-block { margin-bottom: 40px; }

    /* ── MANGA GRID (packs / anciennes cartes) ── */
    .manga-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 16px;
    }
    .manga-card {
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(124,92,252,0.1);
      box-shadow: 0 4px 20px rgba(124,92,252,0.06);
      border-radius: 12px; overflow: hidden;
      text-decoration: none; display: block;
      transition: transform .25s, box-shadow .25s, border-color .25s; color: var(--text);
    }
    .manga-card:hover { transform: translateY(-5px); box-shadow: 0 12px 36px rgba(0,0,0,0.4); border-color: rgba(124,111,239,0.28); }
    .manga-cover { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: linear-gradient(135deg, #1e1e35, #2e1e4e); }
    .manga-cover-ph { width: 100%; aspect-ratio: 2/3; background: linear-gradient(135deg, #1e1e35 0%, #2e1e4e 100%); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
    .manga-card-info { padding: 10px 12px 12px; }
    .manga-card-title { font-weight: 700; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
    .manga-card-meta { display: flex; flex-wrap: wrap; gap: 4px; }
    .manga-statut { font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
    .manga-statut-en_cours { background: rgba(61,220,132,0.15); color: var(--success-link); }
    .manga-statut-termine  { background: rgba(124,111,239,0.15); color: var(--purple-link); }
    .manga-statut-pause,
    .manga-statut-hiatus   { background: rgba(245,166,35,0.15); color: var(--amber-link); }
    .manga-genre { font-size: 0.68rem; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--surface2); color: var(--muted); }

    /* ── MANGA FEED (grille compacte, plusieurs résultats visibles d'un coup) ── */
    .manga-feed { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    @media (min-width: 480px) { .manga-feed { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 720px) { .manga-feed { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
    .manga-feed-card {
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(124,92,252,0.1);
      box-shadow: 0 4px 20px rgba(124,92,252,0.06);
      border-radius: 14px;
      overflow: hidden; text-decoration: none; color: var(--text); display: block;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .manga-feed-card:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(124,92,252,0.16); border-color: rgba(124,92,252,0.3); }
    .manga-feed-cover-wrap { position: relative; width: 100%; aspect-ratio: 2/3; overflow: hidden; background: linear-gradient(135deg, #e9e2fb, #ffe1ee); }
    .manga-feed-cover { width: 100%; height: 100%; object-fit: cover; display: block; }
    .manga-feed-cover-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .manga-feed-badge-time {
      position: absolute; top: 6px; left: 6px;
      background: rgba(0,0,0,0.55); color: #fff; font-size: 0.6rem; font-weight: 700;
      padding: 3px 8px; border-radius: 20px; backdrop-filter: blur(4px);
    }
    .manga-feed-badges-bottom { position: absolute; bottom: 6px; left: 6px; display: flex; gap: 4px; align-items: center; }
    .manga-feed-flag {
      width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #fff; font-size: 0.72rem; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .manga-feed-adult {
      background: var(--orange); color: #fff; font-size: 0.6rem; font-weight: 800;
      padding: 3px 7px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .manga-feed-body { padding: 9px 10px 11px; }
    .manga-feed-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
    .manga-feed-title {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 0.85rem; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    .manga-feed-likes { font-size: 0.68rem; color: var(--muted); display: flex; align-items: center; gap: 3px; flex-shrink: 0; white-space: nowrap; margin-top: 2px; }
    .manga-feed-synopsis {
      font-size: 0.72rem; color: var(--text-2); line-height: 1.4; margin-bottom: 8px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .manga-feed-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .manga-feed-tag { font-size: 0.62rem; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: var(--surface2); color: var(--muted); }

    /* ── CREATORS LIST ── */
    /* Rangée de genres : les vingt genres n'existaient que dans un menu
       déroulant replié — personne ne les voyait, et rien n'invitait à en
       explorer un. */
    .genres-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
    .genre-chip {
      /* 31px de haut : sous le seuil de 32px pour un doigt. Les pastilles
         de genre sont des filtres qu'on tape vraiment, pas de la
         décoration — on les monte à 36px sans changer leur allure. */
      display: inline-flex; align-items: center; min-height: 36px;
      font-size: .8rem; font-weight: 700; padding: 6px 14px; border-radius: 20px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); text-decoration: none; transition: all .2s;
    }
    .genre-chip:hover, .genre-chip:focus-visible {
      border-color: var(--purple); color: var(--purple-link);
      background: rgba(124,92,252,.07);
    }
    .genre-chip[aria-current="page"] {
      background: rgba(124,92,252,.07); border-color: var(--purple); color: var(--purple-link);
    }
    .creators-list { display: flex; flex-direction: column; gap: 12px; }
    .creator-card {
      display: flex; align-items: center; gap: 16px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(124,92,252,0.1);
      box-shadow: 0 4px 20px rgba(124,92,252,0.06);
      border-radius: 14px; padding: 14px 16px;
      text-decoration: none; color: var(--text);
      transition: border-color .2s, background .2s;
    }
    .creator-card:hover { border-color: rgba(124,111,239,0.3); background: var(--bg-2); }
    .creator-avatar {
      width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 800;
      color: #fff; overflow: hidden; text-transform: uppercase;
    }
    .creator-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .creator-info { flex: 1; min-width: 0; }
    .creator-username {
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem;
      margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
    }
    .badge-creator {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(124,111,239,0.15); border: 1px solid rgba(124,111,239,0.3);
      color: var(--purple-link); font-size: 0.65rem; font-weight: 800;
      padding: 2px 8px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .creator-bio {
      font-size: 0.82rem; color: var(--muted); line-height: 1.5;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .creator-arrow { color: var(--muted); font-size: 1rem; flex-shrink: 0; }

    /* ── EMPTY / NO RESULTS ── */
    .no-results {
      text-align: center; padding: 80px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .no-results-icon { font-size: 3.5rem; }
    .no-results h2 { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; }
    .no-results p { color: var(--muted); font-size: 0.9rem; }
    .no-results .btn-retry {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface2); color: var(--text); border: 1px solid var(--border2);
      padding: 10px 22px; border-radius: 10px; font-weight: 700; font-size: 0.9rem;
      text-decoration: none; cursor: pointer; transition: background .2s; font-family: 'DM Sans', sans-serif;
    }
    .no-results .btn-retry:hover { background: rgba(124,111,239,0.15); }

    /* ── EMPTY TERM ── */
    .empty-term {
      text-align: center; padding: 80px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .empty-term-icon { font-size: 3rem; }
    .empty-term p { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>

      <option value="">Tous</option>

      <option value="termine">Terminé</option>
      <option value="pause">En pause</option>

  <div class="filter-group">
    <label for="filterTri">Trier par</label>

      <option value="recent">Plus récents</option>

// ── SEARCH LOGIC ──
const params = new URLSearchParams(window.location.search);
const query  = params.get('q') || '';
/* `?vue=createurs` donne enfin une destination au « Voir tout → » de la
   rangée de créateurs de l'accueil, qui ne menait nulle part. */
const vue    = params.get('vue') || '';

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function statutClass(s) {
  if (!s) return '';
  return 'manga-statut manga-statut-' + s.toLowerCase().replace(/\s+/g,'_');
}
function statutLabel(s) {
  if (!s) return '';
  const map = { en_cours: 'En cours', termine: 'Terminé', pause: 'En pause', hiatus: 'Hiatus' };
  return map[s.toLowerCase()] || s;
}

const LANG_FLAGS = { fr: '🇫🇷', en: '🇬🇧', jp: '🇯🇵', kr: '🇰🇷', cn: '🇨🇳', es: '🇪🇸' };
function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const h = Math.floor(diff / 3600000), d = Math.floor(diff / 86400000), w = Math.floor(diff / 604800000);
  if (h < 1) return 'à l\'instant';
  if (h < 24) return `il y a ${h}h`;
  if (d < 7) return `il y a ${d}j`;
  if (w < 4) return `il y a ${w} sem.`;
  return new Date(dateStr).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}

function renderMangas(mangas) {
  if (!mangas.length) return '';
  return mangas.map(m => {
    const cover = m.couverture_url
      ? `<img class="manga-feed-cover" src="${escapeHtml(m.couverture_url)}" alt="${escapeHtml(m.titre || '')}" loading="lazy" />`
      : `<div class="manga-feed-cover-ph">📖</div>`;
    const flag = LANG_FLAGS[(m.langue || 'fr').toLowerCase()] || '🌐';
    const genres = Array.isArray(m.genres)
      ? m.genres.slice(0,2).map(g => `<span class="manga-feed-tag">${escapeHtml(g)}</span>`).join('')
      : '';
    const synopsis = m.synopsis ? escapeHtml(m.synopsis) : 'Aucune description pour l\'instant.';
    return `<a href="manga.html?id=${m.id}" class="manga-feed-card">
      <div class="manga-feed-cover-wrap">
        ${cover}
        <span class="manga-feed-badge-time">🕐 ${timeAgo(m.created_at)}</span>
        <div class="manga-feed-badges-bottom">
          <span class="manga-feed-flag">${flag}</span>
          ${m.adulte ? '<span class="manga-feed-adult">18+</span>' : ''}
        </div>
      </div>
      <div class="manga-feed-body">
        <div class="manga-feed-title-row">
          <div class="manga-feed-title">${escapeHtml(m.titre || 'Sans titre')}</div>
          <div class="manga-feed-likes">${m.nb_avis > 0 && m.note_moyenne
            ? `<span style="color:var(--amber-link);font-weight:700;">★ ${Number(m.note_moyenne).toFixed(1)}</span> · ` : ''}👁 ${m.vues || 0}</div>
        </div>
        <div class="manga-feed-synopsis">${synopsis}</div>
        <div class="manga-feed-tags">
          <span class="manga-feed-tag">${escapeHtml(statutLabel(m.statut))}</span>
          ${genres}
        </div>
      </div>
    </a>`;
  }).join('');
}

function renderCreators(profiles) {
  if (!profiles.length) return '';
  return profiles.map(p => {
    const initiale = (p.username || '?')[0].toUpperCase();
    const avatar = p.avatar_url
      ? `<img src="${escapeHtml(p.avatar_url)}" alt="${escapeHtml(p.username || '')}" />`
      : initiale;
    const badge = p.is_creator ? `<span class="badge-creator">✏️ Créateur</span>` : '';
    const bio = p.bio ? escapeHtml(p.bio) : '<span style="color:var(--muted);font-style:italic;">Aucune bio</span>';
    return `<a href="auteur.html?id=${escapeHtml(p.id)}" class="creator-card">
      <div class="creator-avatar">${avatar}</div>
      <div class="creator-info">
        <div class="creator-username">${escapeHtml(p.username || 'Inconnu')} ${badge}</div>
        <div class="creator-bio">${bio}</div>
      </div>
      <span class="creator-arrow">›</span>
    </a>`;
  }).join('');
}

function renderPacks(packs) {
  if (!packs.length) return '';
  return packs.map(p => {
    const cover = p.image_url
      ? `<img class="manga-cover" src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.titre || '')}" loading="lazy" />`
      : `<div class="manga-cover-ph">🎓</div>`;
    const prix = Number(p.prix);
    const priceLabel = (prix === 0 || isNaN(prix))
      ? 'GRATUIT'
      : `${prix % 1 === 0 ? prix : prix.toFixed(2)}€`;
    const priceCls = (prix === 0 || isNaN(prix)) ? 'manga-statut-en_cours' : 'manga-statut-termine';
    const auteur = p.auteur_nom ? `<span class="manga-genre">${escapeHtml(p.auteur_nom)}</span>` : '';
    return `<a href="pack.html?id=${p.id}" class="manga-card">
      ${cover}
      <div class="manga-card-info">
        <div class="manga-card-title">${escapeHtml(p.titre || 'Sans titre')}</div>
        <div class="manga-card-meta"><span class="manga-statut ${priceCls}">${priceLabel}</span>${auteur}</div>
      </div>
    </a>`;
  }).join('');
}

// ── FILTRES & PAGINATION ──
const PAGE_SIZE = 24;
const GENRES = [
  'Action','Aventure','Romance','Fantasy','Science-fiction',
  'Horreur','Mystère','Comédie','Drame','Slice of life',
  'Shonen','Shojo','Seinen','Josei','Isekai',
  'Sport','Historique','Thriller','Supernatural','Ecchi'
];
const filters = {
  genre:  params.get('genre')  || '',
  type:   params.get('type')   || '',
  statut: params.get('statut') || '',
  tri:    params.get('tri')    || 'recent',
};
let loadedMangas = [];
let totalMangas  = 0;

// Construit la requête mangas pour une page donnée. `count: 'exact'` sert à
// annoncer le total : sans lui, impossible de savoir s'il reste des titres.
function fetchMangas(offset) {
  let q = sb.from('mangas').select('*', { count: 'exact' }).neq('statut', 'brouillon');
  /* Préférence « masquer le contenu 18+ » (page Paramètres), désactivée
     par défaut : on ne masque que si la personne l'a explicitement demandé. */
  if (masquerAdulte) q = q.neq('adulte', true);
  if (query)          q = q.or(`titre.ilike.%${query}%,synopsis.ilike.%${query}%`);
  if (filters.genre)  q = q.contains('genres', [filters.genre]);
  if (filters.type)   q = q.eq('type', filters.type);
  if (filters.statut) q = q.eq('statut', filters.statut);

  if (filters.tri === 'vues')       q = q.order('vues', { ascending: false, nullsFirst: false });
  /* Un manga sans avis n'est pas « mal noté », il est simplement sans note :
     nullsFirst:false le range après les œuvres notées plutôt qu'en tête. */
  else if (filters.tri === 'note')  q = q.order('note_moyenne', { ascending: false, nullsFirst: false })
                                         .order('nb_avis', { ascending: false, nullsFirst: false });
  else if (filters.tri === 'titre') q = q.order('titre', { ascending: true });
  else                              q = q.order('created_at', { ascending: false });

  return q.range(offset, offset + PAGE_SIZE - 1);
}

function filtersActive() {
  return !!(filters.genre || filters.type || filters.statut) || filters.tri !== 'recent';
}

// Les filtres vivent dans l'URL : un résultat filtré peut être partagé ou
// remis en favori, et le bouton Précédent du navigateur les restaure.
function applyFilters() {
  const p = new URLSearchParams();
  if (query) p.set('q', query);
  ['genre','type','statut'].forEach(k => { if (filters[k]) p.set(k, filters[k]); });
  if (filters.tri !== 'recent') p.set('tri', filters.tri);
  window.location.search = p.toString();
}

function initFilters() {
  const gs = document.getElementById('filterGenre');
  GENRES.forEach(g => {
    const o = document.createElement('option');
    o.value = g; o.textContent = g;
    gs.appendChild(o);
  });
  gs.value = filters.genre;
  document.getElementById('filterType').value   = filters.type;
  document.getElementById('filterStatut').value = filters.statut;
  document.getElementById('filterTri').value    = filters.tri;

  [['filterGenre','genre'],['filterType','type'],['filterStatut','statut'],['filterTri','tri']]
    .forEach(([id, key]) => document.getElementById(id).addEventListener('change', function () {
      filters[key] = this.value;
      applyFilters();
    }));

  const reset = document.getElementById('btnResetFilters');
  reset.style.display = filtersActive() ? 'block' : 'none';
  reset.addEventListener('click', () => {
    window.location.search = query ? 'q=' + encodeURIComponent(query) : '';
  });
}

// Ajoute une page de résultats à la suite, sans recharger ceux déjà affichés
async function loadMoreMangas(btn) {
  btn.disabled = true;
  btn.textContent = 'Chargement…';
  const { data, error } = await fetchMangas(loadedMangas.length);
  if (error) {
    btn.disabled = false;
    btn.textContent = 'Réessayer';
    return;
  }
  loadedMangas = loadedMangas.concat(data || []);
  document.getElementById('mangaFeed').insertAdjacentHTML('beforeend', renderMangas(data || []));
  updateCount();
  if (loadedMangas.length >= totalMangas) btn.closest('.load-more-wrap').remove();
  else { btn.disabled = false; btn.textContent = 'Voir plus de mangas'; }
}

function updateCount() {
  const el = document.getElementById('filtersCount');
  if (!el) return;
  el.textContent = totalMangas
    ? `${loadedMangas.length} manga${loadedMangas.length > 1 ? 's' : ''} affiché${loadedMangas.length > 1 ? 's' : ''} sur ${totalMangas}`
    : '';
}

/* Préférence 18+ — lue une fois au chargement.
   Personne ne l'a demandée tant qu'elle n'a pas été cochée dans Paramètres :
   le catalogue est donc complet par défaut. La lecture elle-même reste
   protégée par l'écran d'avertissement d'âge du lecteur. */
let masquerAdulte = false;
async function chargerPreferenceAdulte() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session || !session.user) return;
    const { data } = await sb.from('profiles')
      .select('pref_masquer_adulte').eq('id', session.user.id).maybeSingle();
    if (data && data.pref_masquer_adulte === true) masquerAdulte = true;
  } catch (e) { /* réglage indisponible : on n'invente pas de filtre */ }
}

/* Vue « tous les créateurs » : une page à part entière, avec sa propre
   adresse. Seuls ceux qui ont publié quelque chose y figurent — un profil
   créateur vide n'a rien à montrer. */
async function afficherCreateurs() {
  const wrap = document.getElementById('mainContent');
  document.getElementById('heroTitle').innerHTML = '🧑‍🎨 Les créateurs';
  document.title = 'Les créateurs — Inkrise';
  document.getElementById('filtersBar').style.display = 'none';
  wrap.innerHTML = '<div class="page-loading"><div class="loading-ring"></div>' +
    '<span>Chargement des créateurs…</span></div>';

  const [mangasRes, packsRes] = await Promise.all([
    sb.from('mangas').select('auteur_id').neq('statut', 'brouillon'),
    sb.from('packs_tutoriels').select('auteur_id'),
  ]);
  if (mangasRes.error && packsRes.error) {
    console.error('Créateurs :', mangasRes.error || packsRes.error);
    wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div>' +
      '<div class="empty-title">Chargement impossible</div>' +
      '<div class="empty-sub">Le serveur n\'a pas répondu. Vérifie ta connexion et réessaie.</div></div>';
    return;
  }
  const ids = [...new Set([...(mangasRes.data || []), ...(packsRes.data || [])]
    .map(x => x.auteur_id).filter(Boolean))];
  if (!ids.length) {
    wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">🧑‍🎨</div>' +
      '<div class="empty-title">Aucun créateur pour l\'instant</div>' +
      '<div class="empty-sub">Publie une œuvre et tu seras le premier.</div>' +
      '<a href="upload-manga.html" class="btn-reset-filters" style="margin-top:14px;display:inline-block;">Publier un manga</a></div>';
    return;
  }
  const { data: profils } = await sb.from('profiles')
    .select('*').in('id', ids).order('created_at', { ascending: true });
  const liste = profils || [];
  wrap.innerHTML =
    '<div class="section-block"><div class="section-header">' +
      '<div class="section-title">🧑‍🎨 Créateurs</div>' +
      '<span class="section-count">' + liste.length +
        (liste.length > 1 ? ' créateurs' : ' créateur') + '</span>' +
    '</div><div class="creators-list">' + renderCreators(liste) + '</div></div>';
}

/* Les genres ne vivaient que dans un menu déroulant replié : aucun visiteur
   ne tombait dessus par hasard. */
function rangeeGenres() {
  const actuel = filters.genre;
  const lien = (libelle, valeur) => {
    const p = new URLSearchParams();
    if (query) p.set('q', query);
    if (valeur) p.set('genre', valeur);
    return '<a class="genre-chip" href="recherche.html' +
      (p.toString() ? '?' + p.toString() : '') + '"' +
      (valeur === actuel ? ' aria-current="page"' : '') + '>' + escapeHtml(libelle) + '</a>';
  };
  return '<nav class="genres-bar" aria-label="Parcourir par genre">' +
    lien('Tous', '') + GENRES.map(g => lien(g, g)).join('') + '</nav>';
}

function titreCatalogue(browseAll, total) {
  const compte = typeof total === 'number'
    ? ` <span style="color:var(--muted);font-size:.85rem;font-weight:600;">(${total})</span>` : '';
  if (!browseAll) return `Résultats pour <em>« ${escapeHtml(query)} »</em>${compte}`;
  return (filters.genre ? `📖 ${escapeHtml(filters.genre)}` : '📖 Tous les mangas') + compte;
}

async function doSearchPage() {
  const wrap = document.getElementById('mainContent');
  if (vue === 'createurs') { await afficherCreateurs(); return; }
  const browseAll = !query;
  await chargerPreferenceAdulte();
  initFilters();

  if (browseAll) {
    document.getElementById('heroTitle').innerHTML = titreCatalogue(true);
    document.title = (filters.genre ? filters.genre + ' — ' : '') + 'Mangas — Inkrise';
  } else {
    document.getElementById('heroTitle').innerHTML = `Résultats pour <em>« ${escapeHtml(query)} »</em>`;
    document.getElementById('heroSearchInput').value = query;

    document.title = `"${query}" — Inkrise`;
  }

  wrap.innerHTML = `<div class="page-loading" id="loader"><div class="loading-ring"></div><span>${browseAll ? 'Chargement des mangas…' : 'Recherche en cours…'}</span></div>`;

  const term = query;
  const [{ data: mangas, error: eM, count: mangaTotal }, { data: profiles, error: eP }, { data: packs, error: ePk }] = await Promise.all([
    fetchMangas(0),
    browseAll
      ? Promise.resolve({ data: [] })
      : sb.from('profiles').select('*').or(`username.ilike.%${term}%,bio.ilike.%${term}%`).limit(20),
    browseAll
      ? Promise.resolve({ data: [] })
      : sb.from('packs_tutoriels').select('*').or(`titre.ilike.%${term}%,description.ilike.%${term}%`).limit(20),
  ]);

  loadedMangas = mangas || [];
  totalMangas  = typeof mangaTotal === 'number' ? mangaTotal : loadedMangas.length;

  const mangaList  = mangas  || [];
  const profilList = profiles || [];
  const packList   = packs   || [];

  if (!mangaList.length && !profilList.length && !packList.length) {
    // Une liste vide à cause des filtres n'est pas un catalogue vide : on
    // propose de les relâcher plutôt que de laisser croire qu'il n'y a rien.
    const resetHref = query ? 'recherche.html?q=' + encodeURIComponent(query) : 'recherche.html';
    wrap.innerHTML = filtersActive()
      ? `
      <div class="no-results">
        <div class="no-results-icon">🔎</div>
        <h2>Aucun titre avec ces filtres</h2>
        <p>${query ? `Rien ne correspond à <strong>« ${escapeHtml(query)} »</strong> avec les filtres choisis.` : 'Aucun manga ne correspond aux filtres choisis.'}</p>
        <a href="${resetHref}" class="btn-retry">Réinitialiser les filtres</a>
      </div>`
      : browseAll
      ? `
      <div class="no-results">
        <div class="no-results-icon">📖</div>
        <h2>Aucun manga publié pour l'instant</h2>
        <p>Reviens bientôt, ou publie le tien !</p>
        <a href="upload-manga.html" class="btn-retry">Publier un manga</a>
      </div>`
      : `
      <div class="no-results">
        <div class="no-results-icon">😕</div>
        <h2>Aucun résultat</h2>
        <p>Aucun manga, créateur ni pack ne correspond à <strong>« ${escapeHtml(query)} »</strong>.</p>
        <a href="recherche.html" class="btn-retry">Voir tous les mangas</a>
      </div>`;
    updateCount();
    return;
  }

  let html = '';

  if (mangaList.length) {
    html += `
      <div class="section-block">
        <div class="section-header">
          <div class="section-title">📖 Mangas</div>
          <span class="section-count">${totalMangas} résultat${totalMangas > 1 ? 's' : ''}</span>
        </div>
        <div class="manga-feed" id="mangaFeed">${renderMangas(mangaList)}</div>
      </div>`;
    if (loadedMangas.length < totalMangas) {
      html += `<div class="load-more-wrap">
        <button class="btn-load-more" id="btnLoadMore">Voir plus de mangas</button>
      </div>`;
    }
  }

  if (profilList.length) {
    html += `
      <div class="section-block">
        <div class="section-header">
          <div class="section-title">🧑‍🎨 Créateurs</div>
          <span class="section-count">${profilList.length} résultat${profilList.length > 1 ? 's' : ''}</span>
        </div>
        <div class="creators-list">${renderCreators(profilList)}</div>
      </div>`;
  }

  if (packList.length) {
    html += `
      <div class="section-block">
        <div class="section-header">
          <div class="section-title">🎓 Packs & Tutoriels</div>
          <span class="section-count">${packList.length} résultat${packList.length > 1 ? 's' : ''}</span>
        </div>
        <div class="manga-grid">${renderPacks(packList)}</div>
      </div>`;
  }

  /* Le titre est posé deux fois : avant le chargement, puis une fois le
     total connu. La deuxième écrasait la première et faisait disparaître
     le nom du genre parcouru — d'où une seule fonction pour les deux. */
  const total = mangaList.length + profilList.length + packList.length;
  document.getElementById('heroTitle').innerHTML = titreCatalogue(browseAll, total);

  wrap.innerHTML = rangeeGenres() + html;
  updateCount();
  const more = document.getElementById('btnLoadMore');
  if (more) more.addEventListener('click', () => loadMoreMangas(more));
}

doSearchPage();
</script>
