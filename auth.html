<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkrise — Connexion / Inscription</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --ink: #0a0a0f;
  --ink-2: #13131c;
  --surface: #1e1e2e;
  --surface-2: #252538;
  --border: rgba(255,255,255,0.07);
  --border-2: rgba(255,255,255,0.12);
  --purple: #7c6fef;
  --purple-light: #a89af7;
  --purple-dim: rgba(124,111,239,0.15);
  --teal: #2dd4a0;
  --text: #f0effe;
  --text-2: #9896b8;
  --text-3: #5e5c7a;
  --radius: 12px;
  --radius-lg: 18px;
  --error: #f87171;
  --success: #2dd4a0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed;
  top: -200px; right: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(124,111,239,0.1) 0%, transparent 70%);
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  bottom: -150px; left: -150px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(45,212,160,0.06) 0%, transparent 70%);
  pointer-events: none;
}

/* LOGO */
.logo-top {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
  text-decoration: none;
  margin-bottom: 32px;
  display: block;
  text-align: center;
}
.logo-top span { color: var(--purple); }

/* CARD */
.card {
  background: var(--ink-2);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-lg);
  padding: 36px 32px;
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
  animation: fadeUp 0.4s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* TABS */
.tabs {
  display: flex;
  gap: 0;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 4px;
  margin-bottom: 28px;
}
.tab-btn {
  flex: 1;
  background: transparent;
  border: none;
  padding: 9px;
  border-radius: 9px;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-3);
  cursor: pointer;
  transition: all 0.2s;
}
.tab-btn.active {
  background: var(--purple);
  color: #fff;
}

/* FORM */
.form-title {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}
.form-sub {
  font-size: 13px;
  color: var(--text-3);
  margin-bottom: 24px;
}

.field {
  margin-bottom: 16px;
}
.field label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  margin-bottom: 7px;
}
.field input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  padding: 12px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.field input::placeholder { color: var(--text-3); }
.field input:focus { border-color: var(--purple); }

.btn-submit {
  width: 100%;
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  padding: 13px;
  border-radius: var(--radius);
  border: none;
  background: var(--purple);
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-submit:hover { background: var(--purple-light); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,111,239,0.3); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* MESSAGES */
.msg {
  display: none;
  padding: 12px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  margin-top: 14px;
  line-height: 1.5;
}
.msg.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.25); color: var(--error); display: block; }
.msg.success { background: rgba(45,212,160,0.1); border: 1px solid rgba(45,212,160,0.25); color: var(--success); display: block; }

/* DIVIDER */
.or-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  color: var(--text-3);
  font-size: 12px;
}
.or-divider::before, .or-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* BACK LINK */
.back-link {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: var(--text-3);
}
.back-link a {
  color: var(--purple-light);
  text-decoration: none;
  font-weight: 500;
}
.back-link a:hover { text-decoration: underline; }

/* LOADING SPINNER */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* SUCCESS STATE */
.success-state {
  display: none;
  text-align: center;
  padding: 20px 0;
}
.success-icon {
  font-size: 48px;
  margin-bottom: 16px;
}
.success-title {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 8px;
}
.success-sub {
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.6;
}
</style>
</head>
<body>

<a href="index.html" class="logo-top">INK<span>RISE</span></a>

<div class="card">
  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('login')">Connexion</button>
    <button class="tab-btn" onclick="switchTab('signup')">S'inscrire</button>
  </div>

  <!-- FORMULAIRE CONNEXION -->
  <div id="loginForm">
    <div class="form-title">Bon retour ! 👋</div>
    <div class="form-sub">Connecte-toi à ton compte Inkrise</div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="ton@email.com" />
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <div style="position:relative"><input type="password" id="loginPassword" placeholder="••••••••" style="padding-right:44px;width:100%" /><button type="button" onclick="togglePwd('loginPassword',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#5e5c7a;font-size:16px;padding:0">👁</button></div>
    </div>
    <button class="btn-submit" id="loginBtn" onclick="handleLogin()">
      <span class="spinner" id="loginSpinner"></span>
      <span id="loginBtnText">Se connecter</span>
    </button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- FORMULAIRE INSCRIPTION -->
  <div id="signupForm" style="display:none">
    <div class="form-title">Rejoins Inkrise 🎨</div>
    <div class="form-sub">Crée ton compte gratuitement</div>

    <!-- SUCCESS STATE -->
    <div class="success-state" id="signupSuccess">
      <div class="success-icon">📧</div>
      <div class="success-title">Vérifie tes emails !</div>
      <div class="success-sub">On t'a envoyé un lien de confirmation. Clique dessus pour activer ton compte.</div>
    </div>

    <div id="signupFields">
      <div class="field">
        <label>Nom d'utilisateur</label>
        <input type="text" id="signupUsername" placeholder="ton_pseudo" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="ton@email.com" />
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <div style="position:relative"><input type="password" id="signupPassword" placeholder="6 caractères minimum" style="padding-right:44px;width:100%" /><button type="button" onclick="togglePwd('signupPassword',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#5e5c7a;font-size:16px;padding:0">👁</button></div>
      </div>
      <button class="btn-submit" id="signupBtn" onclick="handleSignup()">
        <span class="spinner" id="signupSpinner"></span>
        <span id="signupBtnText">Créer mon compte</span>
      </button>
      <div class="msg" id="signupMsg"></div>
    </div>
  </div>

  <div class="back-link">
    <a href="index.html">← Retour à l'accueil</a>
  </div>
</div>

<script>
// =============================================
// CONFIG SUPABASE — REMPLACE PAR TES VRAIES CLÉS
// =============================================
const SUPABASE_URL = 'https://bsdcpwtimsgxcnaamwip.supabase.co'
const SUPABASE_KEY = 'eyJhbG...fb44'
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

// =============================================
// SWITCH TABS
// =============================================
function switchTab(tab) {
  const tabs = document.querySelectorAll('.tab-btn')
  tabs.forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'))
  })
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none'
  document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none'
}

// =============================================
// HELPERS
// =============================================
function showMsg(id, text, type) {
  const el = document.getElementById(id)
  el.textContent = text
  el.className = 'msg ' + type
}
function hideMsg(id) {
  const el = document.getElementById(id)
  el.className = 'msg'
}
function setLoading(btnId, spinnerId, textId, loading, text) {
  const btn = document.getElementById(btnId)
  const spinner = document.getElementById(spinnerId)
  const txtEl = document.getElementById(textId)
  btn.disabled = loading
  spinner.style.display = loading ? 'block' : 'none'
  txtEl.textContent = text
}

// =============================================
// CONNEXION
// =============================================
async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim()
  const password = document.getElementById('loginPassword').value
  hideMsg('loginMsg')

  if (!email || !password) {
    showMsg('loginMsg', 'Remplis tous les champs.', 'error')
    return
  }

  setLoading('loginBtn', 'loginSpinner', 'loginBtnText', true, 'Connexion...')

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password })

  if (error) {
    showMsg('loginMsg', 'Email ou mot de passe incorrect.', 'error')
    setLoading('loginBtn', 'loginSpinner', 'loginBtnText', false, 'Se connecter')
    return
  }

  showMsg('loginMsg', '✓ Connecté ! Redirection...', 'success')
  setTimeout(() => { window.location.href = 'index.html' }, 1000)
}

// =============================================
// INSCRIPTION
// =============================================
async function handleSignup() {
  const username = document.getElementById('signupUsername').value.trim()
  const email = document.getElementById('signupEmail').value.trim()
  const password = document.getElementById('signupPassword').value
  hideMsg('signupMsg')

  if (!username || !email || !password) {
    showMsg('signupMsg', 'Remplis tous les champs.', 'error')
    return
  }
  if (username.length < 3) {
    showMsg('signupMsg', 'Le pseudo doit faire au moins 3 caractères.', 'error')
    return
  }
  if (password.length < 6) {
    showMsg('signupMsg', '⚠️ Le mot de passe doit faire au moins 6 caractères.', 'error')
    return
  }

  setLoading('signupBtn', 'signupSpinner', 'signupBtnText', true, 'Création...')

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: { data: { username } }
  })

  if (error) {
    let msg = 'Une erreur est survenue.'
    if (error.message.includes('already')) msg = 'Cet email est déjà utilisé.'
    showMsg('signupMsg', msg, 'error')
    setLoading('signupBtn', 'signupSpinner', 'signupBtnText', false, 'Créer mon compte')
    return
  }

  // Créer le profil dans la table profiles
  if (data.user) {
    await supabaseClient.from('profiles').insert({
      id: data.user.id,
      username: username
    })
  }

  document.getElementById('signupFields').style.display = 'none'
  document.getElementById('signupSuccess').style.display = 'block'
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const loginVisible = document.getElementById('loginForm').style.display !== 'none'
    if (loginVisible) handleLogin()
    else handleSignup()
  }
})


function togglePwd(id, btn) {
  const input = document.getElementById(id)
  if (input.type === 'password') {
    input.type = 'text'
    btn.textContent = '🙈'
  } else {
    input.type = 'password'
    btn.textContent = '👁'
  }
}

// Vérifier si déjà connecté
supabaseClient.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'index.html'
})
</script>
</body>
</html>
