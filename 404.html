<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable — Inkrise</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#7c5cfc" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/inkrise-theme.css" />
  <script src="assets/inkrise-theme.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(640px 420px at 6% -6%, rgba(124,92,252,0.16), transparent 60%),
        radial-gradient(560px 400px at 100% 6%, rgba(255,95,168,0.13), transparent 60%),
        #faf9fd;
      color: var(--text);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .wrap { max-width: 420px; }
    .logo {
      font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 900;
      letter-spacing: 1px; background: linear-gradient(135deg, #7c5cfc, #ff5fa8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-decoration: none; display: inline-block; margin-bottom: 28px;
    }
    .code {
      font-family: 'Syne', sans-serif; font-size: 5rem; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, #7c5cfc, #ff5fa8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    h1 { font-family: 'Syne', sans-serif; font-size: 1.3rem; margin-bottom: 10px; }
    p { color: var(--text-3); font-size: 0.92rem; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block; background: linear-gradient(135deg, #7c5cfc, #ff5fa8);
      color: #fff; text-decoration: none; font-weight: 700; font-size: 0.9rem;
      padding: 12px 26px; border-radius: 12px;
      box-shadow: 0 10px 30px -8px rgba(124,92,252,0.45);
      transition: transform .2s;
    }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="logo">INKRISE</a>
    <div class="code">404</div>
    <h1>Cette page s'est perdue dans une autre dimension 🌀</h1>
    <p>Le lien que tu as suivi n'existe pas (ou plus). Pas de panique, les mangas t'attendent toujours.</p>
    <a href="/" class="btn">← Retour à l'accueil</a>
  </div>
</body>
</html>
